name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-mock
          pip install -r requirements.txt

      - name: Run Linter (Ruff)
        run: ruff check .

      - name: Run Tests (pytest)
        run: pytest

  build-and-push:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_SSH_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            # Pull latest Docker image
            docker pull ghcr.io/${{ github.repository }}:latest
            
            # Restart container mounting persistent documents and local data directories
            docker stop job-agent || true
            docker rm job-agent || true
            
            docker run -d \
              --name job-agent \
              --restart unless-stopped \
              -p 10000:10000 \
              -v /home/${{ secrets.ORACLE_SSH_USER }}/documents:/app/documents \
              -v /home/${{ secrets.ORACLE_SSH_USER }}/data:/app/data \
              --env-file /home/${{ secrets.ORACLE_SSH_USER }}/.env \
              ghcr.io/${{ github.repository }}:latest

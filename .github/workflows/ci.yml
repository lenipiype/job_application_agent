name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-mock
          pip install -r requirements.txt

      - name: Run Linter (Ruff)
        run: ruff check .

      - name: Run Tests (pytest)
        run: pytest

  build-and-push:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
  
    steps:
      - name: Deploy to Oracle VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_SSH_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
  
            echo "📦 Creating .env file on server..."
  
            cat > /home/ubuntu/.env <<EOF
            TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
  
            EMAIL_ADDRESS=${{ secrets.EMAIL_ADDRESS }}
            SMTP_LOGIN=${{ secrets.SMTP_LOGIN }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
  
            ALLOWED_USER_IDS=${{ secrets.ALLOWED_USER_IDS }}
  
            DB_PATH=/app/data/applications.db
            PORT=10000
            EOF
  
            echo "🔄 Pulling latest Docker image..."
            docker pull ghcr.io/${{ github.repository }}:latest
  
            echo "🛑 Stopping old container..."
            docker stop job-agent || true
            docker rm job-agent || true
  
            echo "🚀 Starting new container..."
            docker run -d \
              --name job-agent \
              --restart unless-stopped \
              -p 10000:10000 \
              -v /home/ubuntu/data:/app/data \
              -v /home/ubuntu/documents:/app/documents \
              --env-file /home/ubuntu/.env \
              ghcr.io/${{ github.repository }}:latest
